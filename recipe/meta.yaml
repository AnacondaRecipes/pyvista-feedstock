{% set name = "pyvista" %}
{% set version = "0.49.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 24cf548b15a375ddb0952bda5ea0ae4948006c7ab724cd676c420f8e04b3718d

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<310]

requirements:
  host:
    - pip
    - python
    - setuptools >=77.0.3
  run:
    - python
    - cyclopts >=4.0.0
    - matplotlib-base >=3.0.1
    - numpy >=1.21.0
    - pillow
    - pooch
    - pyobjc-framework-cocoa  # [osx] # see pyvista/pulls/7828, 8423, and 8832
    - pyvista-validation ==0.2.2 # Exact pin: the validation API is still unstable
    - scooby >=0.5.1
    - typing-extensions >=4.10
    - vtk >=9.3.1,<9.8.0,!=9.4.0,!=9.4.1

# The PyPI sdist omits the tests package and supporting files (including
# tests/__init__.py, tests/conftest.py, and test helper modules), so these
# tests fail during collection because their `tests.*` imports cannot resolve.
# Also tests depends on packages which not in `main` - as example `meshio`
# Run `pip check` only for the moment.
test:
  imports:
    - pyvista
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/pyvista/pyvista
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: 3D plotting and mesh analysis through a streamlined interface for the Visualization Toolkit (VTK)

  description: |
    PyVista: 3D plotting and mesh analysis through a streamlined interface for the Visualization Toolkit (VTK). PyVista is a helper module for the Visualization Toolkit (VTK) that takes a different approach on interfacing with VTK through NumPy and direct array access. This package provides a Pythonic, well-documented interface exposing VTK's powerful visualization backend to facilitate rapid prototyping, analysis, and visual integration of spatially referenced datasets. This module can be used for scientific plotting for presentations and research papers as well as a supporting module for other mesh dependent Python modules.
  doc_url: https://docs.pyvista.org/
  dev_url: https://github.com/pyvista/pyvista

extra:
  recipe-maintainers:
    - banesullivan
    - akaszynski
